<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06070b">
    <title>Trading Log</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: {
                        lg: '768px'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        :root {
            --bg: #06070b;
            --surface: #0f121a;
            --surface-2: #161a24;
            --border: #212635;
            --border-soft: rgba(255,255,255,0.07);
            --text: #eef1f7;
            --text-dim: #8891a4;
            --text-faint: #565e70;
            --accent: #d9a441;
            --accent-bright: #f0bd63;
            --accent-dim: rgba(217,164,65,0.12);
            --profit: #34d399;
            --loss: #fb7185;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        * { box-sizing: border-box; }
        input, select, textarea, button { font-size: 15px !important; font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }

        .bg-glow {
            position: fixed;
            top: -220px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 420px;
            background: radial-gradient(ellipse at center, rgba(217,164,65,0.09) 0%, rgba(217,164,65,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scrollbar disembunyikan visualnya saja - box tetap bisa di-scroll normal */
        .custom-scroll::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        .custom-scroll { scrollbar-width: none; -ms-overflow-style: none; }

        @media (max-width: 767px) {
            #dailySummaryList, #tradeList {
                max-height: calc(100vh - 300px);
                overflow-y: auto;
            }
        }

        .porto-card {
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .porto-input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .porto-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .porto-input::placeholder {
            color: var(--text-faint);
            text-transform: none;
        }

        .row-card {
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
        }
        .row-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0,0,0,.35);
        }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: #e7eaf1;
            letter-spacing: 0.01em;
        }
        .section-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--accent);
            flex-shrink: 0;
        }

        .flatpickr-calendar { background: var(--surface) !important; box-shadow: 0 10px 30px rgba(0,0,0,.6) !important; border: 1px solid var(--border) !important; }
        .flatpickr-day.selected { background: var(--accent) !important; border-color: var(--accent) !important; color: #06070b !important; }
        .flatpickr-day.today { border-color: var(--accent) !important; }

        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .3s ease-out both; }

        @keyframes expandIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .expand-in { animation: expandIn .2s ease-out both; }

        .swal2-popup.swal2-toast {
            font-size: 0.9rem !important;
            display: flex !important;
            align-items: center !important;
        }
        .swal2-toast {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            padding: 0.55em 0.9em !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 20px rgba(0,0,0,.35) !important;
            width: auto !important;
            max-width: max-content !important;
        }
        .swal2-toast .swal2-title {
            font-weight: 600 !important;
            margin: 0 !important;
            line-height: 1.3 !important;
        }
        .swal2-toast .swal2-icon {
            margin: 0 0.5em 0 0 !important;
        }

        .topbar {
            position: sticky;
            top: 0;
            background: rgba(15,18,26,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-soft);
        }
        .topbar::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
            opacity: .45;
        }
        .logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-dim);
            border: 1px solid rgba(217,164,65,0.35);
            color: var(--accent-bright);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kurs-pill {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--profit);
            box-shadow: 0 0 0 0 rgba(52,211,153,.6);
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(52,211,153,.55); }
            70%  { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }

        .hero-panel {
            position: relative;
            overflow: hidden;
        }
        .hero-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(217,164,65,0.06), transparent 55%);
            pointer-events: none;
        }

        .chevron {
            transition: transform .2s ease;
            color: var(--text-faint);
        }
        .chevron.open { transform: rotate(90deg); color: var(--accent); }

        #tabIndicator {
            transition: translate 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        scale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes heatmapToastShow {
            0% { transform: translateY(-10px) rotateZ(2deg); opacity: 0; }
            33% { transform: translateY(0) rotateZ(-2deg); }
            66% { transform: translateY(0) rotateZ(2deg); }
            100% { transform: translateY(0) rotateZ(0deg); opacity: 1; }
        }
        @keyframes heatmapToastHide {
            100% { transform: rotateZ(1deg); opacity: 0; }
        }
        #heatmapTooltip {
            opacity: 0;
            pointer-events: none;
        }
        #heatmapTooltip.show {
            opacity: 1;
            animation: heatmapToastShow 0.4s ease forwards;
        }
        #heatmapTooltip.hide {
            animation: heatmapToastHide 0.2s ease forwards;
        }
    </style>
</head>
<body class="relative">
    <div class="bg-glow"></div>

    <main class="relative z-10 p-2 md:p-4 flex justify-center">
    <div class="w-full max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-2 lg:gap-3 items-start lg:items-stretch">

        <!-- KOLOM 1 (KIRI): Hero PNL + Form Input -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-2.5 lg:flex lg:flex-col">

            <!-- HERO: Total PNL + Equity Curve -->
            <div class="porto-card hero-panel rounded-3xl p-4 md:p-5 lg:shrink-0">
                <div class="relative flex flex-row items-start justify-between gap-2">
                    <div class="shrink-0 cursor-pointer active:opacity-70 transition" onclick="toggleNetPnL()">
                        <div id="totalPnlLabel" class="text-[10px] font-semibold tracking-wide text-[var(--text-faint)] mb-1">Total P&amp;L</div>
                        <div id="statTotal" class="font-display text-2xl sm:text-3xl md:text-3xl font-bold leading-none">–</div>
                        <div id="statTotalIdr" class="num text-[11px] text-[var(--text-dim)] mt-1.5">–</div>
                    </div>
                    <div class="flex lg:hidden xl:flex gap-3 min-w-0 overflow-hidden text-right">
                        <div class="min-w-0">
                            <div class="text-[10px] font-semibold tracking-wide text-[var(--text-faint)] mb-1 truncate">USDT/IDR</div>
                            <div id="headerKursValue" class="font-display text-xs lg:text-sm font-bold text-slate-100 num truncate">–</div>
                        </div>
                        <div class="min-w-0">
                            <div class="text-[10px] font-semibold tracking-wide text-[var(--text-faint)] mb-1 truncate">Trades</div>
                            <div id="statCount" class="font-display text-xs lg:text-sm font-bold text-slate-100 truncate">–</div>
                        </div>
                        <div class="min-w-0">
                            <div class="text-[10px] font-semibold tracking-wide text-[var(--text-faint)] mb-1 truncate">Win rate</div>
                            <div id="statWinRate" class="font-display text-xs lg:text-sm font-bold text-slate-100 truncate">–</div>
                        </div>
                    </div>
                </div>
                <div class="relative mt-2">
                    <div id="equityCurve" class="h-[72px] lg:h-16 w-full touch-none select-none cursor-crosshair"></div>
                    <div id="curveTooltip" class="hidden absolute top-1 z-10 px-1.5 py-0.5 rounded-md bg-[var(--surface-2)] border border-[var(--border)] text-[9px] font-semibold text-slate-100 whitespace-nowrap pointer-events-none"></div>
                </div>
            </div>

            <form id="tradeForm" onsubmit="handleSubmit(event)" class="porto-card p-3.5 rounded-2xl space-y-2 lg:shrink-0">
                <div>
                    <input type="text" id="pair" list="pairList" required placeholder="Pairs" onblur="formatPairInput(this)" class="w-full porto-input rounded-xl px-3.5 py-2 text-sm uppercase font-display font-medium">
                    <datalist id="pairList">
                        <option value="ADAUSDT">
                        <option value="ALGOUSDT">
                        <option value="APTUSDT">
                        <option value="ARBUSDT">
                        <option value="ATOMUSDT">
                        <option value="AVAXUSDT">
                        <option value="BCHUSDT">
                        <option value="BNBUSDT">
                        <option value="BTCUSDT">
                        <option value="CLUSDT">
                        <option value="DOGEUSDT">
                        <option value="DOTUSDT">
                        <option value="ETHUSDT">
                        <option value="FTMUSDT">
                        <option value="INJUSDT">
                        <option value="KORUUSDT">
                        <option value="LINKUSDT">
                        <option value="TCUSDT">
                        <option value="LSKUSDT">
                        <option value="LTCUSDT">
                        <option value="NEARUSDT">
                        <option value="OPUSDT">
                        <option value="PEPEUSDT">
                        <option value="SEIUSDT">
                        <option value="SHIBUSDT">
                        <option value="SKHYNIXUSDT">
                        <option value="SKHYUSDT">
                        <option value="SNDKUSDT">
                        <option value="SOLUSDT">
                        <option value="SOPHUSDT">
                        <option value="SUIUSDT">
                        <option value="TIAUSDT">
                        <option value="TONUSDT">
                        <option value="TRXUSDT">
                        <option value="WIFUSDT">
                        <option value="XRPUSDT">
                        <option value="ZECUSDT">
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-1.5">
                    <div>
                        <label class="block text-xs font-medium text-[var(--text-dim)] mb-1">Opened date</label>
                        <input type="text" id="opened" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2 text-sm font-display">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[var(--text-dim)] mb-1">Closed date</label>
                        <input type="text" id="closed" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2 text-sm font-display">
                    </div>
                </div>

                <div class="relative">
                    <input type="number" step="any" id="pnl" required placeholder="Closing P&L" oninput="updatePnlPreview()" class="w-full porto-input rounded-xl pl-3.5 pr-24 py-2 num font-medium">
                    <span id="pnlPreview" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[11px] text-[var(--text-faint)] num pointer-events-none text-right">≈ Rp 0</span>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-[#1a1305] font-semibold py-2.5 rounded-xl transition shadow-lg shadow-amber-500/20">
                    Simpan position
                </button>
            </form>

            <!-- WIDGET TAMBAHAN (khusus desktop) -->
            <div class="hidden lg:flex lg:flex-col lg:flex-1 lg:min-h-0 space-y-2.5">

                <!-- Statistik Cepat -->
                <div class="porto-card p-3.5 rounded-2xl shrink-0">
                    <div class="flex items-center gap-2 mb-2.5">
                        <span class="section-dot"></span>
                        <h2 class="section-label">Statistik</h2>
                    </div>
                    <div id="quickStatsGrid" class="grid grid-cols-3 gap-2"></div>
                </div>

                <!-- Kalender Aktivitas (Heatmap) -->
                <div class="porto-card p-3.5 rounded-2xl lg:flex lg:flex-col lg:flex-1 lg:min-h-0 relative">
                    <div class="flex items-center justify-between mb-2.5 shrink-0">
                        <div class="flex items-center gap-2">
                            <span class="section-dot"></span>
                            <h2 class="section-label">Kalender aktivitas</h2>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="changeHeatmapMonth(-1)" class="w-5 h-5 flex items-center justify-center rounded-md bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-dim)] hover:text-white hover:border-slate-500 transition text-[10px]">‹</button>
                            <span id="heatmapMonthLabel" class="text-[10px] text-[var(--text-faint)] w-20 text-center"></span>
                            <button type="button" onclick="changeHeatmapMonth(1)" class="w-5 h-5 flex items-center justify-center rounded-md bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-dim)] hover:text-white hover:border-slate-500 transition text-[10px]">›</button>
                        </div>
                    </div>
                    <div id="heatmapCalendar" class="lg:flex-1 lg:flex lg:flex-col lg:min-h-0"></div>
                    <div id="heatmapTooltip" class="absolute z-20 px-2 py-1.5 rounded-lg bg-[var(--surface-2)] border border-[var(--border)] shadow-lg text-center whitespace-nowrap"></div>
                </div>

            </div>
        </div>

        <!-- Tab pill: mobile only, independen dari kedua card -->
        <div class="lg:hidden">
            <div id="tabSwitcher" class="relative flex items-center gap-1 p-1 rounded-full bg-[var(--surface-2)] border border-[var(--border)] mb-1">
                <div id="tabIndicator" class="absolute rounded-full bg-amber-500 shadow-lg shadow-amber-500/25" style="top:4px; bottom:4px; left:4px; width:0;"></div>
                <button type="button" id="tabBtnRekap" onclick="switchTab('rekap')" class="relative z-10 flex-1 text-center text-xs font-semibold py-2 rounded-full transition-colors text-[#1a1305]">Rekap Harian</button>
                <button type="button" id="tabBtnRiwayat" onclick="switchTab('riwayat')" class="relative z-10 flex-1 text-center text-xs font-semibold py-2 rounded-full transition-colors text-slate-400">Riwayat Trade</button>
            </div>
        </div>

        <!-- KOLOM 2 (TENGAH): Rekap Harian (accordion) -->
        <div id="rekapCardWrap" class="lg:col-span-4 xl:col-span-4 lg:block">
            <div id="rekapCard" class="porto-card p-3 rounded-2xl space-y-1 lg:flex lg:flex-col lg:h-[880px]">

                <div class="hidden lg:flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="section-dot"></span>
                        <h2 class="section-label">Rekap harian</h2>
                    </div>
                    <span class="text-[10px] text-[var(--text-faint)]">Klik untuk buka</span>
                </div>
                <div id="dailySummaryList" class="space-y-1.5 overflow-y-auto pr-1 custom-scroll lg:flex-1 lg:min-h-0"></div>
            </div>
        </div>

        <!-- KOLOM 3 (KANAN): Riwayat Trade (selalu semua, tidak difilter) -->
        <div id="riwayatCardWrap" class="lg:col-span-4 xl:col-span-4 hidden lg:block">
            <div id="riwayatCard" class="porto-card p-3 rounded-2xl space-y-1 lg:flex lg:flex-col lg:h-[880px]">
                <div class="hidden lg:flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="section-dot"></span>
                        <h2 class="section-label">Riwayat trade</h2>
                    </div>
                    <span class="text-[10px] text-[var(--text-faint)]">Tahan untuk edit/hapus</span>
                </div>
                <div id="loading" class="text-center text-xs text-[var(--text-faint)] py-6" style="display:none;">Memuat data...</div>
                <div id="tradeList" class="space-y-1.5 overflow-y-auto pr-1 custom-scroll lg:flex-1 lg:min-h-0"></div>
            </div>
        </div>

    </div>
    </main>

    <!-- ACTION SHEET: Edit / Hapus -->
    <div id="actionModal" onclick="if(event.target===this) closeActionModal()" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-3 rounded-2xl space-y-1.5 rise-in">
            <button type="button" id="actionEditBtn" class="w-full text-left px-4 py-3.5 rounded-xl hover:bg-[var(--surface-2)] transition flex items-center gap-3 text-sm font-medium text-slate-200">
                <span>✏️</span> Edit Trade
            </button>
            <button type="button" id="actionDeleteBtn" class="w-full text-left px-4 py-3.5 rounded-xl hover:bg-rose-500/10 transition flex items-center gap-3 text-sm font-medium text-rose-400">
                <span>🗑️</span> Hapus Trade
            </button>
            <button type="button" onclick="closeActionModal()" class="w-full text-center px-4 py-3 rounded-xl bg-[var(--surface-2)] text-slate-400 text-xs font-medium mt-1">
                Batal
            </button>
        </div>
    </div>

    <!-- MODAL EDIT -->
    <div id="editModal" onclick="if(event.target===this) closeEditModal()" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl shadow-2xl space-y-4 rise-in">
            <h3 class="font-display font-bold text-white text-base">Edit Trade #<span id="editNoLabel"></span></h3>
            <div>
                <label class="block text-xs font-medium text-[var(--text-dim)] mb-1.5">Pair / Koin</label>
                <input type="text" id="editPair" class="w-full porto-input rounded-xl px-3.5 py-2.5 uppercase font-medium">
            </div>
            <div>
                <label class="block text-xs font-medium text-[var(--text-dim)] mb-1.5">Closing PNL (USDT)</label>
                <input type="number" step="any" id="editPnl" class="w-full porto-input rounded-xl px-3.5 py-2.5 num font-medium">
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeEditModal()" class="w-1/2 bg-[var(--surface-2)] hover:bg-[#1d2230] text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition border border-[var(--border)]">
                    Batal
                </button>
                <button type="button" id="confirmEditBtn" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-[#1a1305] font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-amber-500/20">
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL HAPUS -->
    <div id="deleteModal" onclick="if(event.target===this) closeDeleteModal()" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl border border-rose-500/30 shadow-2xl space-y-4 rise-in text-center relative">
            <div class="w-12 h-12 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto">
                ⚠️
            </div>
            <div>
                <h3 class="font-display font-bold text-white text-base mb-1">Hapus trade</h3>
                <p id="deleteModalText" class="text-xs text-[var(--text-dim)]">Yakin mau hapus trade ini?</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeDeleteModal()" class="w-1/2 bg-[var(--surface-2)] hover:bg-[#1d2230] text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition border border-[var(--border)]">
                    Batal
                </button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-rose-600/20">
                    Hapus
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxXyZd1pekC0tZRdwuY-aQzJb7veINYpp_sheoxMemO9sSrduj26QRhR4kHokR5iqJq/exec"; 
        let currentKursIdr = 17550;
        let selectedNoForAction = null; // trade # yang sedang dipilih lewat long-press
        let selectedNoToDelete = null;
        let expandedDate = null; // tanggal yang sedang di-expand di Rekap Harian
        let activeTab = 'rekap'; // tab aktif di mobile: 'rekap' atau 'riwayat'
        let cachedGlobalResponse = { history: [], totalPnl: 0, totalTrades: 0, winRate: 0 };
        let toastTimeout = null;
        let curveState = { w: 600, h: 100, data: [] };
        let isCurveDragging = false;
        let isNetPnlView = false;
        const now_ = new Date();
        let heatmapYear = now_.getFullYear();
        let heatmapMonth = now_.getMonth();

        function fetchRealtimeKurs() {
            fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR")
                .then(res => res.json())
                .then(data => {
                    if (data && data.price) {
                        currentKursIdr = parseFloat(data.price);
                        const kursEl = document.getElementById('headerKursValue');
                        if (kursEl) kursEl.textContent = `≈ ${formatRupiah(currentKursIdr)}`;

                .catch(err => console.log("Pakai kurs fallback:", currentKursIdr));

        const getTodayStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const todayStr = getTodayStr();

            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",

            disableMobile: true
        });

        const openedPicker = flatpickr("#opened", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            defaultDate: "today",
            disableMobile: true,
            onChange: function(selectedDates, dateStr) {
                if (!dateStr) return;
                closedPicker.set("minDate", dateStr);
                if (dateStr > todayStr) {
                    closedPicker.setDate(dateStr, true);
                } else {
                    closedPicker.setDate(todayStr, true);
                }
            }
        });

        function formatPairInput(input) {
            let val = input.value.trim().toUpperCase();
            if (val && !val.includes("USDT")) {
                input.value = val + "USDT";
            } else {
                input.value = val;
            }
        }

        function updatePnlPreview() {
            const el = document.getElementById('pnlPreview');
            if (!el) return;
            const val = parseFloat(document.getElementById('pnl').value) || 0;
            const isProfit = val >= 0;
            el.textContent = `≈ ${isProfit ? '' : '-'}${formatRupiah(Math.abs(val) * currentKursIdr)}`;
            el.style.color = val === 0 ? 'var(--text-faint)' : (isProfit ? 'var(--profit)' : 'var(--loss)');

        function showToast(message, type = 'success') {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer);
                    toast.addEventListener('mouseleave', Swal.resumeTimer);
                }
            });

            if (type === 'success') {
                Toast.fire({
                    icon: 'success',
                    title: message,
                    background: 'linear-gradient(to right, #00b09b, #96c93d)',
                    color: '#ffffff',
                    iconColor: '#ffffff'
                });
            } else {
                Toast.fire({
                    icon: 'error',
                    title: message,
                    background: 'linear-gradient(to right, #ff416c, #ff4b2b)',
                    color: '#ffffff',
                    iconColor: '#ffffff'
                });
            }
        }

        function moveTabIndicator(activeBtn, instant) {
            const indicator = document.getElementById('tabIndicator');
            const wrapper = document.getElementById('tabSwitcher');
            if (!indicator || !wrapper || !activeBtn) return;

            const wrapperRect = wrapper.getBoundingClientRect();
            const btnRect = activeBtn.getBoundingClientRect();
            const left = btnRect.left - wrapperRect.left - 4;
            const width = btnRect.width;

            if (instant) {
                indicator.style.transition = 'none';
                indicator.style.width = `${width}px`;
                indicator.style.translate = `${left}px 0px`;
                void indicator.offsetWidth;
                indicator.style.transition = '';
                return;
            }

            indicator.style.width = `${width}px`;
            indicator.style.translate = `${left}px 0px`;
            indicator.style.scale = '1.15 1';
            setTimeout(() => { indicator.style.scale = '1 1'; }, 60);
        }

        function switchTab(tab, instant) {
            activeTab = tab;
            const rekapCard = document.getElementById('rekapCardWrap');
            const riwayatCard = document.getElementById('riwayatCardWrap');
            const btnRekap = document.getElementById('tabBtnRekap');
            const btnRiwayat = document.getElementById('tabBtnRiwayat');

            // Di desktop (lg+) dua-duanya tetap tampil terpisah (class lg:block
            // di riwayatCard yang nge-override 'hidden'); ini cuma ngatur mobile.
            if (tab === 'rekap') {
                rekapCard.classList.remove('hidden');
                riwayatCard.classList.add('hidden');
                btnRekap.classList.remove('text-slate-400');
                btnRekap.classList.add('text-[#1a1305]');
                btnRiwayat.classList.remove('text-[#1a1305]');
                btnRiwayat.classList.add('text-slate-400');
                moveTabIndicator(btnRekap, instant);
            } else {
                rekapCard.classList.add('hidden');
                riwayatCard.classList.remove('hidden');
                btnRiwayat.classList.remove('text-slate-400');
                btnRiwayat.classList.add('text-[#1a1305]');
                btnRekap.classList.remove('text-[#1a1305]');
                btnRekap.classList.add('text-slate-400');
                moveTabIndicator(btnRiwayat, instant);
            }
        }

        window.onload = function() {
            fetchRealtimeKurs();
            switchTab('rekap', true);
            window.addEventListener('resize', () => {
                const activeBtn = activeTab === 'rekap' ? document.getElementById('tabBtnRekap') : document.getElementById('tabBtnRiwayat');
                moveTabIndicator(activeBtn, true);
            });
            initCurveInteraction();
            
            const cachedData = localStorage.getItem('tradingDataCache');
            if (cachedData) {
                try {
                    cachedGlobalResponse = JSON.parse(cachedData);
                    renderDashboard(cachedGlobalResponse);
                } catch(e) {}
            }
            
            fetch(`${API_URL}?_ts=${Date.now()}`, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    cachedGlobalResponse = data;
                    localStorage.setItem('tradingDataCache', JSON.stringify(data));
                    renderDashboard(data);
                })
                .catch(err => console.log(err));

        function getDayName(dateStr) {
            if (!dateStr) return '';
            var parts = dateStr.split('/');
            if (parts.length === 3) {
                var d = new Date(parts[2], parts[1] - 1, parts[0]);
                var days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
                return days[d.getDay()] || '';
            }
            return '';
        }

        function parseClosedDate(dateStr) {
            if (!dateStr) return null;
            var parts = dateStr.split('/');
            if (parts.length !== 3) return null;
            var d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            return isNaN(d.getTime()) ? null : d;
        }

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function recalcTotals() {
            let sumPnl = 0, wins = 0;
            cachedGlobalResponse.history.forEach(item => {
                sumPnl += parseFloat(item.pnl) || 0;
                if ((parseFloat(item.pnl) || 0) > 0) wins++;
            });
            cachedGlobalResponse.totalPnl = sumPnl;
            cachedGlobalResponse.totalTrades = cachedGlobalResponse.history.length;
            cachedGlobalResponse.winRate = cachedGlobalResponse.totalTrades > 0 ? Math.round((wins / cachedGlobalResponse.totalTrades) * 100) : 0;
        }

        // LOGIKA INSTAN: render lokal duluan, sync ke Sheet di belakang layar.
        // TIDAK ada refetch langsung setelah kirim -> itu penyebab data sempat
        // "kedip" balik ke versi lama (race condition / cache jaringan).
        function handleSubmit(e) {
            e.preventDefault();
            const pairField = document.getElementById('pair');
            formatPairInput(pairField);

            const pairVal = pairField.value;
            const openedVal = document.getElementById('opened').value;
            const closedVal = document.getElementById('closed').value;
            const pnlVal = parseFloat(document.getElementById('pnl').value) || 0;

            const [y, m, d] = closedVal.split('-');
            const formattedClosedDate = `${d}/${m}/${y}`;

            const maxNo = (cachedGlobalResponse.history && cachedGlobalResponse.history.length > 0) 
                ? Math.max(...cachedGlobalResponse.history.map(x => parseInt(x.no) || 0)) 
                : 0;

            const newItem = {
                no: maxNo + 1,
                pair: pairVal,
                opened: openedVal,
                closed: formattedClosedDate,
                pnl: pnlVal
            };

            if (!cachedGlobalResponse.history) cachedGlobalResponse.history = [];
            cachedGlobalResponse.history.unshift(newItem);
            recalcTotals();

            localStorage.setItem('tradingDataCache', JSON.stringify(cachedGlobalResponse));
            renderDashboard(cachedGlobalResponse);

            showToast("Tersimpan", "success");

            document.getElementById('pair').value = '';
            document.getElementById('pnl').value = '';
            updatePnlPreview();

            const encPair = encodeURIComponent(pairVal);
            const encOpened = encodeURIComponent(openedVal);
            const encClosed = encodeURIComponent(closedVal);
            const encPnl = encodeURIComponent(pnlVal);

            fetch(`${API_URL}?action=add&pair=${encPair}&opened=${encOpened}&closed=${encClosed}&pnl=${encPnl}`, { cache: 'no-store' })
                .catch(err => {
                    console.log(err);
                    showToast("Gagal sync ke Sheet", "error");
                });
        }

        function bindLongPress(element, no) {
            let pressTimer = null;

            const startPress = (e) => {
                if (e.type === 'click') return;
                pressTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(50);
                    handleHapus(no);
                }, 500);
            };

            const cancelPress = () => {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            };

            element.addEventListener('mousedown', startPress);
            element.addEventListener('touchstart', startPress, { passive: true });

            element.addEventListener('mouseup', cancelPress);
            element.addEventListener('mouseleave', cancelPress);
            element.addEventListener('touchend', cancelPress);
            element.addEventListener('touchmove', cancelPress);
            element.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
        }

            // Riwayat Trade: SELALU semua trade, tidak pernah difilter

        function renderEquityCurve(history) {
            const container = document.getElementById('equityCurve');
            if (!container) return;

            if (!history || history.length === 0) {
                curveState = { w: 600, h: 100, data: [] };
                container.innerHTML = '<div class="h-full flex items-center text-[11px] text-[var(--text-faint)]">Belum ada data untuk kurva.</div>';
                return;
            }

            const chron = [...history].reverse();
            let cum = 0;
            const points = chron.map(item => { cum += parseFloat(item.pnl) || 0; return cum; });

            const n = points.length;
            const w = 600, h = 100;
            const min = Math.min(0, ...points);
            const max = Math.max(0, ...points);
            const range = (max - min) || 1;
            const stepX = n > 1 ? w / (n - 1) : 0;

            const coords = points.map((v, i) => {
                const x = n > 1 ? i * stepX : w / 2;
                const y = h - ((v - min) / range) * h;
                return [x, y];
            });

            curveState = {
                w, h,
                data: coords.map((c, i) => ({
                    x: c[0],
                    y: c[1],
                    value: points[i],
                    dateShort: (chron[i].closed || '').split('/').slice(0, 2).join('/')
                }))
            };

            const linePath = coords.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
            const areaPath = `${linePath} L${w},${h} L0,${h} Z`;
            const isProfit = points[points.length - 1] >= 0;
            const strokeColor = isProfit ? '#34d399' : '#fb7185';

            container.innerHTML = `
                <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full h-full">
                    <defs>
                        <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.35" />
                            <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                    <path d="${areaPath}" fill="url(#sparkGrad)" stroke="none" />
                    <path d="${linePath}" fill="none" stroke="${strokeColor}" stroke-width="2" vector-effect="non-scaling-stroke" />
                    <g id="curveCrosshairGroup" style="opacity:0; transition:opacity .12s ease;">
                        <line id="curveCrosshairLine" x1="0" y1="0" x2="0" y2="${h}" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-dasharray="4,3" vector-effect="non-scaling-stroke" />
                        <circle id="curveCrosshairDot" r="4" fill="${strokeColor}" stroke="#06070b" stroke-width="1.5" vector-effect="non-scaling-stroke" />
                    </g>
                </svg>
            `;
        }

        function initCurveInteraction() {
            const container = document.getElementById('equityCurve');
            const tooltip = document.getElementById('curveTooltip');
            if (!container || !tooltip) return;

            const getVbX = (e) => {
                const rect = container.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let relX = rect.width > 0 ? (clientX - rect.left) / rect.width : 0;
                relX = Math.max(0, Math.min(1, relX));
                return { vbX: relX * curveState.w, rect };
            };

            const updateCrosshair = (e) => {
                const data = curveState.data;
                if (!data || data.length === 0) return;
                const { vbX, rect } = getVbX(e);

                let nearestIdx = 0, nearestDist = Infinity;
                data.forEach((p, i) => {
                    const dist = Math.abs(p.x - vbX);
                    if (dist < nearestDist) { nearestDist = dist; nearestIdx = i; }
                });
                const point = data[nearestIdx];

                const line = document.getElementById('curveCrosshairLine');
                const dot = document.getElementById('curveCrosshairDot');
                const group = document.getElementById('curveCrosshairGroup');
                if (!line || !dot || !group) return;

                line.setAttribute('x1', point.x);
                line.setAttribute('x2', point.x);
                dot.setAttribute('cx', point.x);
                dot.setAttribute('cy', point.y);
                group.style.opacity = '1';

                const leftPx = (point.x / curveState.w) * rect.width;
                tooltip.textContent = point.dateShort;
                tooltip.classList.remove('hidden');
                tooltip.style.left = '0px';
                const tw = tooltip.offsetWidth || 32;
                let left = leftPx - tw / 2;
                left = Math.max(0, Math.min(rect.width - tw, left));
                tooltip.style.left = `${left}px`;
            };

            const hideCrosshair = () => {
                isCurveDragging = false;
                const group = document.getElementById('curveCrosshairGroup');
                if (group) group.style.opacity = '0';
                tooltip.classList.add('hidden');
            };

            const startDrag = (e) => {
                if (!curveState.data || curveState.data.length === 0) return;
                isCurveDragging = true;
                updateCrosshair(e);
            };
            const moveDrag = (e) => {
                if (!isCurveDragging) return;
                if (e.cancelable) e.preventDefault();
                updateCrosshair(e);
            };

            container.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', moveDrag);
            window.addEventListener('mouseup', hideCrosshair);
            container.addEventListener('mouseleave', hideCrosshair);

            container.addEventListener('touchstart', startDrag, { passive: true });
            container.addEventListener('touchmove', moveDrag, { passive: false });
            container.addEventListener('touchend', hideCrosshair);
            container.addEventListener('touchcancel', hideCrosshair);
        }

        function getWeekStartKey(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diffToMonday = (day === 0 ? -6 : 1 - day);
            date.setDate(date.getDate() + diffToMonday);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function renderQuickStats(history) {
            const grid = document.getElementById('quickStatsGrid');
            if (!grid) return;
            if (!history || history.length === 0) {
                grid.innerHTML = '<p class="text-[11px] text-[var(--text-faint)] col-span-3 text-center py-2">Belum ada data.</p>';
                return;
            }

            const dailyMap = {}, weeklyMap = {}, monthlyMap = {};
            history.forEach(item => {
                const d = parseClosedDate(item.closed);
                if (!d) return;
                const p = parseFloat(item.pnl) || 0;

                const dayKey = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                dailyMap[dayKey] = (dailyMap[dayKey] || 0) + p;

                const weekKey = getWeekStartKey(d);
                weeklyMap[weekKey] = (weeklyMap[weekKey] || 0) + p;

                const monthKey = `${d.getFullYear()}-${d.getMonth()}`;
                monthlyMap[monthKey] = (monthlyMap[monthKey] || 0) + p;
            });

            const avg = (map) => {
                const vals = Object.values(map);
                if (vals.length === 0) return 0;
                return vals.reduce((a, b) => a + b, 0) / vals.length;
            };

            const avgDaily = avg(dailyMap);
            const avgWeekly = avg(weeklyMap);
            const avgMonthly = avg(monthlyMap);

            const cell = (label, val) => {
                const isProfit = val >= 0;
                return `
                    <div class="text-center p-2 rounded-xl bg-[var(--bg)] border border-[var(--border)]">
                        <div class="text-[9px] text-[var(--text-faint)] mb-1">${label}</div>
                        <div class="num text-xs font-bold ${isProfit ? 'text-emerald-400' : 'text-rose-400'}">${isProfit ? '+' : ''}${val.toFixed(2)}</div>
                    </div>
                `;
            };

            grid.innerHTML = cell('Avg Harian', avgDaily) + cell('Avg Mingguan', avgWeekly) + cell('Avg Bulanan', avgMonthly);
        }

        function changeHeatmapMonth(delta) {
            heatmapMonth += delta;
            if (heatmapMonth > 11) { heatmapMonth = 0; heatmapYear++; }
            if (heatmapMonth < 0) { heatmapMonth = 11; heatmapYear--; }
            renderHeatmap(cachedGlobalResponse.history || []);
        }

        function renderHeatmap(history) {
            const container = document.getElementById('heatmapCalendar');
            const monthLabel = document.getElementById('heatmapMonthLabel');
            if (!container) return;

            const oldTooltip = document.getElementById('heatmapTooltip');
            if (oldTooltip) oldTooltip.classList.remove('show', 'hide');

            const year = heatmapYear;
            const month = heatmapMonth;
            const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            if (monthLabel) monthLabel.textContent = `${monthNames[month]} ${year}`;

            const dailyMap = {};
            (history || []).forEach(item => {
                const d = parseClosedDate(item.closed);
                if (!d) return;
                if (d.getFullYear() === year && d.getMonth() === month) {
                    const key = d.getDate();
                    if (!dailyMap[key]) dailyMap[key] = 0;
                    dailyMap[key] += parseFloat(item.pnl) || 0;
                }
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const vals = Object.values(dailyMap).map(v => Math.abs(v));
            const maxAbs = vals.length > 0 ? Math.max(...vals, 1) : 1;

            const weekdayLabels = ['M', 'S', 'S', 'R', 'K', 'J', 'S'];
            let cellsHtml = weekdayLabels.map(w => `<div class="text-[8px] text-[var(--text-faint)] text-center">${w}</div>`).join('');

            for (let i = 0; i < firstDay; i++) {
                cellsHtml += `<div></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const val = dailyMap[day];
                let bg = 'var(--surface-2)';
                let textColor = 'var(--text-faint)';
                if (val !== undefined) {
                    const intensity = Math.min(1, Math.abs(val) / maxAbs);
                    bg = val >= 0 ? `rgba(52,211,153,${0.2 + intensity * 0.6})` : `rgba(251,113,133,${0.2 + intensity * 0.6})`;
                    textColor = '#fff';
                }
                const valAttr = val !== undefined ? val : 'null';
                cellsHtml += `<div class="aspect-square lg:aspect-auto rounded-md flex items-center justify-center text-[9px] font-medium cursor-pointer" style="background:${bg}; color:${textColor}" onclick="showHeatmapDayDetail(event, ${day}, ${valAttr})">${day}</div>`;
            }

            container.innerHTML = `<div class="grid grid-cols-7 gap-1 lg:h-full lg:grid-rows-[auto_repeat(6,1fr)]">${cellsHtml}</div>`;
        }

        function showHeatmapDayDetail(e, day, val) {
            const tooltip = document.getElementById('heatmapTooltip');
            const card = e.currentTarget.closest('.porto-card');
            if (!tooltip || !card) return;

            let html;
            if (val === null || val === undefined) {
                html = `<div style="font-size:10px;color:#565e70;">Tidak ada trade</div>`;
            } else {
                const isProfit = val >= 0;
                const color = isProfit ? '#34d399' : '#fb7185';
                const rp = formatRupiah(val * currentKursIdr);
                html = `
                    <div style="font-size:11px;font-weight:700;color:${color};">${isProfit ? '+' : ''}${val.toFixed(2)} USDT</div>
                    <div style="font-size:9px;color:#8891a4;margin-top:1px;">${rp}</div>
                `;
            }

            tooltip.classList.remove('show', 'hide');
            tooltip.innerHTML = html;

            const cellRect = e.currentTarget.getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();

            const top = cellRect.top - cardRect.top - tooltip.offsetHeight - 6;
            let left = cellRect.left - cardRect.left + (cellRect.width / 2) - (tooltip.offsetWidth / 2);
            left = Math.max(4, Math.min(cardRect.width - tooltip.offsetWidth - 4, left));

            tooltip.style.top = `${Math.max(4, top)}px`;
            tooltip.style.left = `${left}px`;

            void tooltip.offsetWidth;
            tooltip.classList.add('show');

            clearTimeout(window._heatmapTooltipTimeout);
            window._heatmapTooltipTimeout = setTimeout(() => {
                tooltip.classList.remove('show');
                tooltip.classList.add('hide');
            }, 2000);
        }

        function handleError(err) {
            console.error(err);
        }
    </script>
</body>
