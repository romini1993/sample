<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06070b">
    <title>Trading Log</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root {
            --bg: #06070b;
            --surface: #0f121a;
            --surface-2: #161a24;
            --border: #212635;
            --border-soft: rgba(255,255,255,0.07);
            --text: #eef1f7;
            --text-dim: #8891a4;
            --text-faint: #565e70;
            --accent: #d9a441;
            --accent-bright: #f0bd63;
            --accent-dim: rgba(217,164,65,0.12);
            --profit: #34d399;
            --loss: #fb7185;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        * { box-sizing: border-box; }
        input, select, textarea, button { font-size: 15px !important; font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }

        .bg-glow {
            position: fixed;
            top: -220px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 420px;
            background: radial-gradient(ellipse at center, rgba(217,164,65,0.09) 0%, rgba(217,164,65,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 1023px) {
            #dailySummaryList { max-height: 380px; overflow-y: auto; }
        }

        .porto-card {
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .porto-input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .porto-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .row-card {
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
        }
        .row-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0,0,0,.35);
        }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: #e7eaf1;
            letter-spacing: 0.01em;
        }
        .section-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--accent);
            flex-shrink: 0;
        }

        .flatpickr-calendar { background: var(--surface) !important; box-shadow: 0 10px 30px rgba(0,0,0,.6) !important; border: 1px solid var(--border) !important; }
        .flatpickr-day.selected { background: var(--accent) !important; border-color: var(--accent) !important; color: #06070b !important; }
        .flatpickr-day.today { border-color: var(--accent) !important; }

        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .3s ease-out both; }

        #toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .topbar {
            position: sticky;
            top: 0;
            background: rgba(15,18,26,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-soft);
        }
        .topbar::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
            opacity: .45;
        }
        .logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-dim);
            border: 1px solid rgba(217,164,65,0.35);
            color: var(--accent-bright);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kurs-pill {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--profit);
            box-shadow: 0 0 0 0 rgba(52,211,153,.6);
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(52,211,153,.55); }
            70%  { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }

        .hero-panel {
            position: relative;
            overflow: hidden;
        }
        .hero-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(217,164,65,0.06), transparent 55%);
            pointer-events: none;
        }

        .coin-badge {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="relative">
    <div class="bg-glow"></div>

    <!-- TOP BAR -->
    <header class="topbar relative z-40">
        <div class="max-w-[1600px] mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="logo-mark">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 17 L4 11" />
                        <rect x="2.3" y="11" width="3.4" height="4" rx="0.6" />
                        <path d="M12 19 L12 9" />
                        <rect x="10.3" y="9" width="3.4" height="6" rx="0.6" />
                        <path d="M20 15 L20 5" />
                        <rect x="18.3" y="5" width="3.4" height="6" rx="0.6" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-display text-[15px] font-bold tracking-tight text-white leading-none">Trading Log</h1>
                    <p class="text-[11px] text-[var(--text-dim)] mt-1">Jurnal presisi & rekap otomatis</p>
                </div>
            </div>
            <div class="kurs-pill num text-[11px] px-3 py-1.5 rounded-full whitespace-nowrap flex items-center gap-2">
                <span class="pulse-dot"></span>
                <span id="headerKursValue">Memuat kurs…</span>
            </div>
        </div>
    </header>

    <main class="relative z-10 p-3 md:p-6 flex justify-center">
    <div class="w-full max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

        <!-- HERO: Total PNL + Equity Curve -->
        <div class="lg:col-span-12">
            <div class="porto-card hero-panel rounded-3xl p-5 md:p-7">
                <div class="relative flex flex-col md:flex-row md:items-end justify-between gap-6">
                    <div>
                        <div class="text-[11px] font-semibold tracking-wide text-[var(--text-faint)] mb-1.5">Total P&amp;L</div>
                        <div id="statTotal" class="font-display text-4xl md:text-5xl font-bold leading-none">–</div>
                        <div id="statTotalIdr" class="num text-sm text-[var(--text-dim)] mt-2">–</div>
                    </div>
                    <div class="flex gap-8 md:gap-12">
                        <div>
                            <div class="text-[11px] font-semibold tracking-wide text-[var(--text-faint)] mb-1.5">Trades</div>
                            <div id="statCount" class="font-display text-2xl font-bold text-slate-100">–</div>
                        </div>
                        <div>
                            <div class="text-[11px] font-semibold tracking-wide text-[var(--text-faint)] mb-1.5">Win rate</div>
                            <div id="statWinRate" class="font-display text-2xl font-bold text-slate-100">–</div>
                        </div>
                    </div>
                </div>
                <div id="equityCurve" class="relative mt-5 h-20 md:h-24 w-full"></div>
            </div>
        </div>

        <!-- KOLOM 1 (KIRI): Form Input -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-5 lg:sticky lg:top-20">
            <form id="tradeForm" onsubmit="handleSubmit(event)" class="porto-card p-5 rounded-2xl space-y-4">
                <div class="flex items-center gap-2">
                    <span class="section-dot"></span>
                    <h2 class="section-label">Input position</h2>
                </div>

                <div>
                    <label class="block text-xs font-medium text-[var(--text-dim)] mb-1.5">Pair / Koin</label>
                    <input type="text" id="pair" list="pairList" required placeholder="Contoh: BTCUSDT" onblur="formatPairInput(this)" class="w-full porto-input rounded-xl px-3.5 py-2.5 uppercase font-medium">
                    <datalist id="pairList">
                        <option value="ADAUSDT">
                        <option value="ALGOUSDT">
                        <option value="APTUSDT">
                        <option value="ARBUSDT">
                        <option value="ATOMUSDT">
                        <option value="AVAXUSDT">
                        <option value="BCHUSDT">
                        <option value="BNBUSDT">
                        <option value="BTCUSDT">
                        <option value="CLUSDT">
                        <option value="DOGEUSDT">
                        <option value="DOTUSDT">
                        <option value="ETHUSDT">
                        <option value="FTMUSDT">
                        <option value="INJUSDT">
                        <option value="KORUUSDT">
                        <option value="LINKUSDT">
                        <option value="TCUSDT">
                        <option value="LSKUSDT">
                        <option value="LTCUSDT">
                        <option value="NEARUSDT">
                        <option value="OPUSDT">
                        <option value="PEPEUSDT">
                        <option value="SEIUSDT">
                        <option value="SHIBUSDT">
                        <option value="SKHYNIXUSDT">
                        <option value="SKHYUSDT">
                        <option value="SNDKUSDT">
                        <option value="SOLUSDT">
                        <option value="SOPHUSDT">
                        <option value="SUIUSDT">
                        <option value="TIAUSDT">
                        <option value="TONUSDT">
                        <option value="TRXUSDT">
                        <option value="WIFUSDT">
                        <option value="XRPUSDT">
                        <option value="ZECUSDT">
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-[var(--text-dim)] mb-1.5">Opened date</label>
                        <input type="text" id="opened" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[var(--text-dim)] mb-1.5">Closed date</label>
                        <input type="text" id="closed" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-[var(--text-dim)] mb-1.5">Closing PNL (USDT)</label>
                    <input type="number" step="any" id="pnl" required placeholder="0.00 (minus pakai -)" oninput="updatePnlPreview()" class="w-full porto-input rounded-xl px-3.5 py-2.5 num font-medium">
                    <div id="pnlPreview" class="text-[11px] text-[var(--text-faint)] num mt-1.5">≈ Rp 0</div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-[#1a1305] font-semibold py-3 rounded-xl transition shadow-lg shadow-amber-500/20">
                    Simpan position
                </button>
            </form>
        </div>

        <!-- KOLOM 2 (TENGAH): Rekap Harian -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:sticky lg:top-20">
            <div class="porto-card p-4 sm:p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-2">
                        <span class="section-dot"></span>
                        <h2 class="section-label">Rekap harian</h2>
                    </div>
                    <span class="text-[10px] text-[var(--text-faint)]">Klik tanggal untuk filter</span>
                </div>
                <div id="dailySummaryList" class="space-y-2 lg:max-h-[calc(100vh-160px)] overflow-y-auto pr-1 custom-scroll"></div>
            </div>
        </div>

        <!-- KOLOM 3 (KANAN): Riwayat Trade -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:sticky lg:top-20">
            <div class="porto-card p-4 sm:p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-2">
                        <span class="section-dot"></span>
                        <h2 id="listHeaderTitle" class="section-label">Riwayat trade</h2>
                    </div>
                    <button id="resetFilterBtn" onclick="filterByDate(null)" class="text-[10px] bg-[var(--surface-2)] hover:bg-[#1d2230] text-slate-300 px-2 py-1 rounded hidden border border-[var(--border)]">
                        ↺ Semua tanggal
                    </button>
                </div>
                <div id="loading" class="text-center text-xs text-[var(--text-faint)] py-6" style="display:none;">Memuat data...</div>
                <div id="tradeList" class="space-y-2 max-h-[calc(100vh-160px)] overflow-y-auto pr-1 custom-scroll"></div>
            </div>
        </div>

    </div>
    </main>

    <!-- MODAL HAPUS -->
    <div id="deleteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl border border-rose-500/30 shadow-2xl space-y-4 rise-in text-center relative">
            <div class="w-12 h-12 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto">
                ⚠️
            </div>
            <div>
                <h3 class="font-display font-bold text-white text-base mb-1">Hapus trade</h3>
                <p id="deleteModalText" class="text-xs text-[var(--text-dim)]">Yakin mau hapus trade ini?</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeDeleteModal()" class="w-1/2 bg-[var(--surface-2)] hover:bg-[#1d2230] text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition border border-[var(--border)]">
                    Batal
                </button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-rose-600/20">
                    Hapus
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2">
        <span id="toastIcon"></span>
        <span id="toastText"></span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxXyZd1pekC0tZRdwuY-aQzJb7veINYpp_sheoxMemO9sSrduj26QRhR4kHokR5iqJq/exec"; 
        let currentKursIdr = 17550;
        let selectedNoToDelete = null;
        let selectedFilterDate = null;
        let cachedGlobalResponse = { history: [], totalPnl: 0, totalTrades: 0, winRate: 0 };
        let toastTimeout = null;

        function fetchRealtimeKurs() {
            fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR")
                .then(res => res.json())
                .then(data => {
                    if (data && data.price) {
                        currentKursIdr = parseFloat(data.price);
                        const kursEl = document.getElementById('headerKursValue');
                        if (kursEl) kursEl.textContent = `1 USDT ≈ ${formatRupiah(currentKursIdr)}`;
                        updatePnlPreview();
                    }
                })
                .catch(err => console.log("Pakai kurs fallback:", currentKursIdr));
        }

        const getTodayStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const todayStr = getTodayStr();

        const closedPicker = flatpickr("#closed", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            defaultDate: "today",
            disableMobile: true
        });

        const openedPicker = flatpickr("#opened", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            defaultDate: "today",
            disableMobile: true,
            onChange: function(selectedDates, dateStr) {
                if (!dateStr) return;
                closedPicker.set("minDate", dateStr);
                if (dateStr > todayStr) {
                    closedPicker.setDate(dateStr, true);
                } else {
                    closedPicker.setDate(todayStr, true);
                }
            }
        });

        function formatPairInput(input) {
            let val = input.value.trim().toUpperCase();
            if (val && !val.includes("USDT")) {
                input.value = val + "USDT";
            } else {
                input.value = val;
            }
        }

        // Live preview konversi PNL -> IDR saat user ngetik
        function updatePnlPreview() {
            const el = document.getElementById('pnlPreview');
            if (!el) return;
            const val = parseFloat(document.getElementById('pnl').value) || 0;
            const isProfit = val >= 0;
            el.textContent = `≈ ${isProfit ? '' : '-'}${formatRupiah(Math.abs(val) * currentKursIdr)}`;
            el.style.color = val === 0 ? 'var(--text-faint)' : (isProfit ? 'var(--profit)' : 'var(--loss)');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastText');

            if (toastTimeout) clearTimeout(toastTimeout);
            text.innerText = message;

            if (type === 'success') {
                icon.innerText = '✓';
                toast.className = "px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 bg-emerald-500/20 border-emerald-500/40 text-emerald-300 show";
            } else {
                icon.innerText = '✕';
                toast.className = "px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 bg-rose-500/20 border-rose-500/40 text-rose-300 show";
            }

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        window.onload = function() {
            fetchRealtimeKurs();
            
            const cachedData = localStorage.getItem('tradingDataCache');
            if (cachedData) {
                try {
                    cachedGlobalResponse = JSON.parse(cachedData);
                    renderDashboard(cachedGlobalResponse);
                } catch(e) {}
            }
            
            // Ambil data terbaru di background (no-store: jangan pernah kena cache)
            fetch(`${API_URL}?_ts=${Date.now()}`, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    cachedGlobalResponse = data;
                    localStorage.setItem('tradingDataCache', JSON.stringify(data));
                    renderDashboard(data);
                })
                .catch(err => console.log(err));
        };

        function filterByDate(dateStr) {
            selectedFilterDate = dateStr;
            renderDashboard(cachedGlobalResponse);
        }

        function getDayName(dateStr) {
            if (!dateStr) return '';
            var parts = dateStr.split('/');
            if (parts.length === 3) {
                var d = new Date(parts[2], parts[1] - 1, parts[0]);
                var days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
                return days[d.getDay()] || '';
            }
            return '';
        }

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(amount);
        }

        // Warna badge koin dihasilkan deterministik dari nama pair, jadi tiap
        // koin selalu punya warna yang sama tiap render, tanpa perlu aset gambar.
        function hashHue(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash) % 360;
        }

        // LOGIKA INSTAN: render lokal duluan, sync ke Sheet di belakang layar.
        // TIDAK ada refetch langsung setelah kirim -> itu penyebab data sempat
        // "kedip" balik ke versi lama (race condition / cache jaringan).
        function handleSubmit(e) {
            e.preventDefault();
            const pairField = document.getElementById('pair');
            formatPairInput(pairField);

            const pairVal = pairField.value;
            const openedVal = document.getElementById('opened').value;
            const closedVal = document.getElementById('closed').value;
            const pnlVal = parseFloat(document.getElementById('pnl').value) || 0;

            const [y, m, d] = closedVal.split('-');
            const formattedClosedDate = `${d}/${m}/${y}`;

            const maxNo = (cachedGlobalResponse.history && cachedGlobalResponse.history.length > 0) 
                ? Math.max(...cachedGlobalResponse.history.map(x => parseInt(x.no) || 0)) 
                : 0;

            const newItem = {
                no: maxNo + 1,
                pair: pairVal,
                opened: openedVal,
                closed: formattedClosedDate,
                pnl: pnlVal
            };

            if (!cachedGlobalResponse.history) cachedGlobalResponse.history = [];
            // unshift, BUKAN push -> history selalu "terbaru duluan" (lihat
            // history.reverse() di Update.gs), jadi item baru wajib masuk ke
            // index 0 (paling atas), bukan ke ujung array.
            cachedGlobalResponse.history.unshift(newItem);

            let sumPnl = 0;
            let wins = 0;
            cachedGlobalResponse.history.forEach(item => {
                sumPnl += parseFloat(item.pnl) || 0;
                if ((parseFloat(item.pnl) || 0) > 0) wins++;
            });
            cachedGlobalResponse.totalPnl = sumPnl;
            cachedGlobalResponse.totalTrades = cachedGlobalResponse.history.length;
            cachedGlobalResponse.winRate = Math.round((wins / cachedGlobalResponse.totalTrades) * 100);

            // Simpan lokal & langsung render instan detik itu juga
            localStorage.setItem('tradingDataCache', JSON.stringify(cachedGlobalResponse));
            renderDashboard(cachedGlobalResponse);

            showToast("Tersimpan", "success");

            document.getElementById('pair').value = '';
            document.getElementById('pnl').value = '';
            updatePnlPreview();

            const encPair = encodeURIComponent(pairVal);
            const encOpened = encodeURIComponent(openedVal);
            const encClosed = encodeURIComponent(closedVal);
            const encPnl = encodeURIComponent(pnlVal);

            // Kirim ke Google Sheet di background. Fire-and-forget: TIDAK ada
            // refetch susulan yang menimpa state lokal yang sudah benar.
            fetch(`${API_URL}?action=add&pair=${encPair}&opened=${encOpened}&closed=${encClosed}&pnl=${encPnl}`, { cache: 'no-store' })
                .catch(err => {
                    console.log(err);
                    showToast("Gagal sync ke Sheet", "error");
                });
        }

        function handleHapus(no) {
            selectedNoToDelete = no;
            document.getElementById('deleteModalText').innerText = "Yakin mau hapus trade No #" + no + "?";
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            selectedNoToDelete = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        // HAPUS INSTAN LOKAL, sync ke Sheet di background tanpa refetch susulan
        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (selectedNoToDelete === null) return;
            const no = selectedNoToDelete;
            closeDeleteModal();

            if (cachedGlobalResponse.history) {
                cachedGlobalResponse.history = cachedGlobalResponse.history.filter(item => parseInt(item.no) !== parseInt(no));
            }

            let sumPnl = 0;
            let wins = 0;
            const totalCount = cachedGlobalResponse.history.length;
            cachedGlobalResponse.history.forEach(item => {
                sumPnl += parseFloat(item.pnl) || 0;
                if ((parseFloat(item.pnl) || 0) > 0) wins++;
            });
            cachedGlobalResponse.totalPnl = sumPnl;
            cachedGlobalResponse.totalTrades = totalCount;
            cachedGlobalResponse.winRate = totalCount > 0 ? Math.round((wins / totalCount) * 100) : 0;

            localStorage.setItem('tradingDataCache', JSON.stringify(cachedGlobalResponse));
            renderDashboard(cachedGlobalResponse);

            showToast("Terhapus", "error");

            fetch(`${API_URL}?action=delete&no=${no}`, { cache: 'no-store' })
                .catch(err => {
                    console.log(err);
                    showToast("Gagal hapus di Sheet", "error");
                });
        };

        function bindLongPress(element, no) {
            let pressTimer = null;

            const startPress = (e) => {
                if (e.type === 'click') return;
                pressTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(50);
                    handleHapus(no);
                }, 500);
            };

            const cancelPress = () => {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            };

            element.addEventListener('mousedown', startPress);
            element.addEventListener('touchstart', startPress, { passive: true });

            element.addEventListener('mouseup', cancelPress);
            element.addEventListener('mouseleave', cancelPress);
            element.addEventListener('touchend', cancelPress);
            element.addEventListener('touchmove', cancelPress);
            element.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
        }

        function renderDashboard(res) {
            const tradeContainer = document.getElementById('tradeList');
            const dailyContainer = document.getElementById('dailySummaryList');
            const headerTitle = document.getElementById('listHeaderTitle');
            const resetBtn = document.getElementById('resetFilterBtn');

            tradeContainer.innerHTML = '';
            dailyContainer.innerHTML = '';

            const data = res.history || [];

            renderStats(res);
            renderEquityCurve(data);

            if (!data || data.length === 0) {
                tradeContainer.innerHTML = '<p class="text-xs text-[var(--text-faint)] text-center py-4">Belum ada data trading.</p>';
                dailyContainer.innerHTML = '<p class="text-xs text-[var(--text-faint)] text-center py-4">Belum ada rekap.</p>';
                return;
            }

            // Render Rekap Harian
            const dailyMap = {};
            data.forEach(item => {
                const closedDate = item.closed;
                const pnlVal = parseFloat(item.pnl) || 0;
                if (!closedDate) return;

                if (!dailyMap[closedDate]) {
                    dailyMap[closedDate] = { total: 0, count: 0 };
                }
                dailyMap[closedDate].total += pnlVal;
                dailyMap[closedDate].count += 1;
            });

            Object.keys(dailyMap).forEach((date, i) => {
                const summary = dailyMap[date];
                const isProf = summary.total >= 0;
                const color = isProf ? 'text-emerald-400' : 'text-rose-400';
                const isSelected = selectedFilterDate === date;
                
                var dayName = getDayName(date);
                var fullDateLabel = dayName ? `${dayName}, ${date}` : date;
                var totalIdr = formatRupiah(summary.total * currentKursIdr);

                const div = document.createElement('div');
                div.className = `row-card p-3 rounded-xl border cursor-pointer flex justify-between items-center border-l-2 ${
                    isSelected 
                    ? 'bg-amber-500/10 border-amber-500 text-white font-bold ring-1 ring-amber-500' 
                    : 'bg-[var(--bg)] border-[var(--border)] hover:border-slate-600 text-slate-200'
                }`;
                div.style.borderLeftColor = isProf ? 'var(--profit)' : 'var(--loss)';
                div.style.animationDelay = `${i * 25}ms`;
                div.onclick = () => filterByDate(isSelected ? null : date);
                div.innerHTML = `
                    <div>
                        <div class="font-display font-bold text-xs sm:text-sm text-white">${fullDateLabel}</div>
                        <div class="text-[10px] sm:text-[11px] text-[var(--text-dim)] mt-0.5">${summary.count} trade tertutup</div>
                    </div>
                    <div class="text-right">
                        <div class="num font-bold text-xs sm:text-sm ${color} whitespace-nowrap">
                            ${isProf ? '+' : ''}${summary.total.toFixed(2)} USDT
                        </div>
                        <div class="num text-[9px] sm:text-[10px] text-[var(--text-dim)] font-medium num mt-0.5 whitespace-nowrap">
                            ${totalIdr}
                        </div>
                    </div>
                `;
                dailyContainer.appendChild(div);
            });

            // Filter Data Riwayat Trade Berdasarkan Tanggal yang Diklik
            let filteredData = data;
            if (selectedFilterDate) {
                filteredData = data.filter(item => item.closed === selectedFilterDate);
                headerTitle.innerText = `Trade: ${selectedFilterDate}`;
                resetBtn.classList.remove('hidden');
            } else {
                headerTitle.innerText = "Riwayat trade";
                resetBtn.classList.add('hidden');
            }

            if (filteredData.length === 0) {
                tradeContainer.innerHTML = '<p class="text-xs text-[var(--text-faint)] text-center py-4">Tidak ada trade pada tanggal ini.</p>';
                return;
            }

            // Render Riwayat Trade: badge koin berwarna + hierarki 2 baris
            filteredData.forEach((item, i) => {
                const pnlNum = parseFloat(item.pnl) || 0;
                const isProfit = pnlNum >= 0;
                const pnlColor = isProfit ? 'text-emerald-400' : 'text-rose-400';
                const totalIdr = formatRupiah(pnlNum * currentKursIdr);

                const hue = hashHue(item.pair);
                const initials = item.pair.replace('USDT', '').slice(0, 3).toUpperCase() || '—';
                const badgeStyle = `background: hsla(${hue},60%,55%,0.16); color: hsl(${hue},70%,70%); border:1px solid hsla(${hue},60%,55%,0.35);`;

                const div = document.createElement('div');
                div.className = `row-card rise-in p-2.5 sm:p-3 rounded-xl border border-[var(--border)] bg-[var(--surface-2)] flex items-center gap-3 cursor-pointer select-none`;
                div.style.animationDelay = `${i * 15}ms`;
                div.innerHTML = `
                    <div class="coin-badge shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-[11px] font-bold" style="${badgeStyle}">${initials}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-display font-bold text-sm text-white truncate">${item.pair}</span>
                            <span class="num font-bold text-sm ${pnlColor} whitespace-nowrap">${isProfit ? '+' : ''}${pnlNum.toFixed(2)} USDT</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-0.5">
                            <span class="text-[10px] sm:text-[11px] text-[var(--text-dim)]">#${item.no} • ${item.closed}</span>
                            <span class="text-[9px] sm:text-[10px] text-[var(--text-faint)] num">${totalIdr}</span>
                        </div>
                    </div>
                `;

                bindLongPress(div, item.no);
                tradeContainer.appendChild(div);
            });
        }

        function renderStats(res) {
            const totalEl = document.getElementById('statTotal');
            const totalIdrEl = document.getElementById('statTotalIdr');
            const countEl = document.getElementById('statCount');
            const winEl = document.getElementById('statWinRate');

            const total = parseFloat(res.totalPnl) || 0;
            const isProfit = total >= 0;

            totalEl.textContent = `${isProfit ? '+' : ''}${total.toFixed(2)} USDT`;
            totalEl.className = `font-display text-4xl md:text-5xl font-bold leading-none ${isProfit ? 'text-emerald-400' : 'text-rose-400'}`;
            
            if (totalIdrEl) {
                totalIdrEl.textContent = formatRupiah(total * currentKursIdr);
            }

            countEl.textContent = res.totalTrades || 0;
            winEl.textContent = `${res.winRate || 0}%`;
        }

        // Equity curve: kumulatif PNL dari trade pertama -> terakhir,
        // digambar sebagai mini area-chart, warna ikut arah total (untung/rugi).
        function renderEquityCurve(history) {
            const container = document.getElementById('equityCurve');
            if (!container) return;

            if (!history || history.length === 0) {
                container.innerHTML = '<div class="h-full flex items-center text-[11px] text-[var(--text-faint)]">Belum ada data untuk kurva.</div>';
                return;
            }

            const chron = [...history].reverse(); // history newest-first -> balik jadi kronologis
            let cum = 0;
            const points = chron.map(item => { cum += parseFloat(item.pnl) || 0; return cum; });

            const n = points.length;
            const w = 600, h = 100;
            const min = Math.min(0, ...points);
            const max = Math.max(0, ...points);
            const range = (max - min) || 1;
            const stepX = n > 1 ? w / (n - 1) : 0;

            const coords = points.map((v, i) => {
                const x = n > 1 ? i * stepX : w / 2;
                const y = h - ((v - min) / range) * h;
                return [x, y];
            });

            const linePath = coords.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
            const areaPath = `${linePath} L${w},${h} L0,${h} Z`;
            const isProfit = points[points.length - 1] >= 0;
            const strokeColor = isProfit ? '#34d399' : '#fb7185';

            container.innerHTML = `
                <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full h-full">
                    <defs>
                        <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.35" />
                            <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                    <path d="${areaPath}" fill="url(#sparkGrad)" stroke="none" />
                    <path d="${linePath}" fill="none" stroke="${strokeColor}" stroke-width="2" vector-effect="non-scaling-stroke" />
                </svg>
            `;
        }

        function handleError(err) {
            console.error(err);
        }
    </script>
</body>
